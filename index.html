<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER BREACH // CYBER INTELLIGENCE ESCAPE ROOM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      position: relative;
      isolation: isolate;
      margin: 0;
      min-height: 100vh;
      background-color: #050811;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .operations-room-scene {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(87, 128, 145, 0.16), transparent 58%),
        linear-gradient(180deg, #15212a 0%, #0a1118 52%, #030609 100%);
    }
    .operations-room-scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, transparent 0 56%, rgba(0, 0, 0, 0.38) 74%, rgba(0, 0, 0, 0.78) 100%),
        radial-gradient(ellipse at 50% 48%, rgba(25, 55, 67, 0.2), transparent 62%);
    }
    .operations-room-scene::after {
      content: "";
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -34%;
      height: 66%;
      transform: perspective(620px) rotateX(58deg);
      transform-origin: center top;
      background:
        linear-gradient(rgba(13, 30, 39, 0.65), rgba(2, 5, 8, 0.9)),
        repeating-linear-gradient(90deg, transparent 0 9.8%, rgba(70, 116, 132, 0.14) 10%, transparent 10.2%),
        repeating-linear-gradient(0deg, transparent 0 17%, rgba(70, 116, 132, 0.12) 17.2%, transparent 17.5%);
    }
    .operations-screen-bank {
      position: absolute;
      top: 19vh;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: clamp(230px, 23vw, 360px);
      height: 31vh;
      min-height: 190px;
      padding: 9px;
      border: 1px solid rgba(135, 164, 174, 0.24);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(31, 43, 49, 0.92), rgba(8, 13, 18, 0.98));
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65), inset 0 1px rgba(210, 230, 235, 0.12);
      opacity: 0.56;
    }
    .operations-screen-bank-left {
      left: -3vw;
      transform: perspective(900px) rotateY(8deg);
    }
    .operations-screen-bank-right {
      right: -3vw;
      transform: perspective(900px) rotateY(-8deg);
    }
    .operations-screen-bank span {
      border: 1px solid rgba(73, 118, 130, 0.28);
      border-radius: 3px;
      background:
        linear-gradient(155deg, transparent 44%, rgba(0, 221, 204, 0.34) 45%, transparent 47%),
        repeating-linear-gradient(0deg, transparent 0 12px, rgba(90, 139, 151, 0.12) 13px, transparent 14px),
        radial-gradient(ellipse at 72% 34%, rgba(35, 91, 103, 0.38), transparent 60%),
        #071117;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.6);
    }
    .operations-console {
      position: absolute;
      left: 22%;
      right: 22%;
      bottom: -5vh;
      height: 17vh;
      transform: perspective(800px) rotateX(9deg);
      border: 1px solid rgba(103, 135, 148, 0.2);
      border-radius: 14px 14px 0 0;
      background:
        linear-gradient(180deg, rgba(45, 59, 65, 0.58), rgba(7, 11, 15, 0.96)),
        repeating-linear-gradient(90deg, transparent 0 8%, rgba(95, 140, 151, 0.08) 8.2%, transparent 8.5%);
      box-shadow: 0 -12px 50px rgba(0, 0, 0, 0.42), inset 0 1px rgba(190, 218, 223, 0.12);
      opacity: 0.48;
    }
    @media (max-width: 640px) {
      .operations-screen-bank {
        top: 23vh;
        width: 43vw;
        height: 20vh;
        min-height: 140px;
        gap: 5px;
        padding: 6px;
        opacity: 0.32;
      }
      .operations-console {
        left: 7%;
        right: 7%;
        height: 12vh;
      }
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono-code { font-family: 'JetBrains Mono', monospace; }

    .cyber-card {
      background: rgba(11, 18, 34, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 0 24px rgba(56, 189, 248, 0.04);
    }
    .neon-cyan {
      color: #00f0ff;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.55);
    }
    .neon-green {
      color: #00ff88;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.5);
    }
    .scanlines {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.16) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    /* Hidden clue text */
    .stealth-buffer {
      background-color: transparent;
      color: transparent;
      border: none;
      user-select: text;
      -webkit-user-select: text;
    }
    .stealth-buffer::selection, .stealth-buffer *::selection {
      background: #00f0ff;
      color: #020617;
    }

    /* Level 04 180-Degree Inversion */
    .inverted-stage {
      transform: rotate(180deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .upright-stage {
      transform: rotate(0deg);
      transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slide-up-entry {
      from { opacity: 0; transform: translateY(48px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-up-entry {
      animation: slide-up-entry 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    /* Custom Right-Click Menu for Level 04 */
    #customContext {
      position: fixed;
      display: none;
      z-index: 2000;
      min-width: 230px;
      background: #0b1222;
      border: 1px solid #00f0ff;
      border-radius: 10px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
  <div class="operations-room-scene" aria-hidden="true">
    <div class="operations-screen-bank operations-screen-bank-left"><span></span><span></span><span></span><span></span></div>
    <div class="operations-screen-bank operations-screen-bank-right"><span></span><span></span><span></span><span></span></div>
    <div class="operations-console"></div>
  </div>
  <div class="fixed inset-0 scanlines z-50"></div>

  <!-- SIMULATED CYBER-BROWSER CHROME & URL ADDRESS BAR -->
  <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800 px-3 sm:px-6 py-2.5">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <!-- Traffic Lights + Website Logo -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-rose-500"></span>
          <span class="w-3 h-3 rounded-full bg-amber-400"></span>
          <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
        </div>
        <button onclick="showLobby()" class="font-orbitron font-black text-xs sm:text-sm tracking-wider neon-cyan hover:opacity-80 transition cursor-pointer">
          CYBER BREACH
        </button>
      </div>

      <!-- Interactive Address Bar -->
      <div class="flex-1 min-w-[260px] max-w-2xl flex items-center bg-slate-900 border border-cyan-400/60 rounded-lg px-3 py-1.5 shadow-[0_0_16px_rgba(0,240,255,0.14)]">
        <span class="text-emerald-400 font-mono-code text-xs mr-1.5 select-none">🔒</span>
        <span id="urlPrefix" class="text-emerald-400 font-mono-code text-xs sm:text-sm whitespace-nowrap select-none">https://nexus-intel.sec/lobby</span>
        <input
          type="text"
          id="addressInput"
          placeholder=""
          autocomplete="off"
          class="flex-1 bg-transparent border-none outline-none text-white font-mono-code text-xs sm:text-sm font-bold tracking-wide ml-0.5"
        />
        <button
          onclick="submitAddressBar()"
          class="ml-2 px-3 py-1 rounded bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-orbitron font-bold text-[11px] tracking-wider cursor-pointer transition"
        >
          GO →
        </button>
      </div>

      <!-- Live Telemetry HUD Controls -->
      <div class="flex items-center gap-2 font-mono-code text-xs">
        <div id="timerBadge" class="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-emerald-400 font-bold">
          00:00
        </div>
        <div id="demotionBadge" class="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-300 font-bold">
          DEMOTIONS: 0
        </div>
        <button
          id="audioToggleBtn"
          onclick="toggleAudio()"
          class="px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-cyan-300 hover:border-cyan-400 cursor-pointer transition"
          title="Toggle Sound Effects"
        >
          SFX: ON
        </button>
      </div>
    </div>
  </header>

  <!-- LEVEL SELECTOR & PROGRESS TRACKER BAR -->
  <nav id="stepperNav" class="hidden border-b border-slate-800/80 bg-slate-950/60 px-4 py-2.5">
    <div class="max-w-6xl mx-auto flex items-center justify-center flex-wrap gap-1.5" id="stepper"></div>
  </nav>

  <!-- MAIN VIEWPORT AREA -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 sm:py-8">
    <!-- Dynamic View Container (Lobby or Active Level) -->
    <div id="appRoot"></div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-slate-900 py-4 px-6 text-center text-xs text-slate-500 font-mono-code">
    CYBER BREACH // 6-LAYER CYBER INTELLIGENCE ESCAPE SIMULATION • USE THE TOP ADDRESS BAR FOR ROUTE PASSKEYS
  </footer>

  <!-- CUSTOM RIGHT-CLICK CONTEXT MENU (LEVEL 04) -->
  <div id="customContext">
    <div onclick="contextInspect()" class="px-4 py-2.5 text-xs font-mono-code text-slate-300 hover:bg-cyan-400 hover:text-slate-950 border-b border-slate-800 cursor-pointer">
      &lt;/&gt; Inspect Element
    </div>
    <div onclick="breakSystemLoop()" class="px-4 py-2.5 text-xs font-mono-code text-emerald-400 font-bold hover:bg-emerald-400 hover:text-slate-950 border-b border-slate-800 cursor-pointer">
      ⚡ Break the System Loop
    </div>
    <div onclick="contextReload()" class="px-4 py-2.5 text-xs font-mono-code text-slate-300 hover:bg-cyan-400 hover:text-slate-950 cursor-pointer">
      ↻ Reload Frame
    </div>
  </div>

  <!-- MODAL POPUP -->
  <div id="modalBackdrop" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="modalBox" class="cyber-card rounded-2xl max-w-lg w-full p-6 border-2 border-cyan-400/60"></div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden max-w-sm rounded-xl bg-slate-900 border-l-4 border-cyan-400 px-4 py-3 text-xs sm:text-sm font-mono-code text-white shadow-2xl"></div>

  <script>
    // =========================================================================
    // 1. WEB AUDIO API SYNTHESIZER (Zero External Audio Dependencies)
    // =========================================================================
    const SFX = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      playTone(freqs, type = 'sine', duration = 0.18, vol = 0.08) {
        if (this.muted) return;
        this.init();
        const now = this.ctx.currentTime;
        freqs.forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          gain.gain.setValueAtTime(vol, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.08 + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + duration + 0.02);
        });
      },
      click() { this.playTone([620], 'triangle', 0.07, 0.05); },
      success() { this.playTone([523.25, 659.25, 783.99, 1046.5], 'triangle', 0.22, 0.08); },
      error() { this.playTone([180, 135], 'sawtooth', 0.24, 0.09); },
      synthEasterEgg() { this.playTone([261.63, 329.63, 392.0, 523.25, 659.25], 'sawtooth', 0.28, 0.07); }
    };

    function toggleAudio() {
      SFX.muted = !SFX.muted;
      document.getElementById('audioToggleBtn').textContent = SFX.muted ? 'SFX: OFF' : 'SFX: ON';
      if (!SFX.muted) SFX.click();
    }

    // =========================================================================
    // 2. GAME STATE & MISSION CONFIGURATION
    // =========================================================================
    const STATE = {
      view: 'LOBBY', // 'LOBBY' | 'GAME'
      level: 0,
      highestUnlocked: 0,
      demotions: 0,
      seconds: 0,
      timerRunning: false,
      l1Phase1: false,
      l1Phase2: false,
      l3Unlocked: false,
      l4LoopBroken: false,
      l5CipherDone: false
    };

    const LEVELS_META = [
      { id: 0, short: "L00: Orientation", title: "Hidden Boot Transmission", type: "Hidden Page Inspection", submit: "In-Page Modal", penalty: "None" },
      { id: 1, short: "L01: Telemetry", title: "Algorithmic Telemetry Engine", type: "Python + Base-2 + Matrix", submit: "Address Bar", penalty: "None" },
      { id: 2, short: "L02: Memory", title: "Machine Memory Archive", type: "Stealth Masking + ASCII", submit: "Address Bar", penalty: "None" },
      { id: 3, short: "L03: DOM Auth", title: "System Authentication Vault", type: "HTML Comment Inspection", submit: "Address Bar", penalty: "RESET TO L01" },
      { id: 4, short: "L04: Inversion", title: "The Interface Lies", type: "180° Screen + Context Override", submit: "Address Bar", penalty: "None" },
      { id: 5, short: "L05: Intercept", title: "Encrypted Tactical Intercept", type: "Caesar Cipher + Letter Sum", submit: "Address Bar", penalty: "RESET TO L01" }
    ];

    // Live Mission Clock
    setInterval(() => {
      if (STATE.timerRunning && STATE.level < 6) {
        STATE.seconds++;
        const m = String(Math.floor(STATE.seconds / 60)).padStart(2, '0');
        const s = String(STATE.seconds % 60).padStart(2, '0');
        document.getElementById('timerBadge').textContent = `${m}:${s}`;
      }
    }, 1000);

    // =========================================================================
    // 3. NAVIGATION, TOASTS, MODALS & DEMOTION ENGINE
    // =========================================================================
    function showToast(msg, borderColor = '#00f0ff') {
      const t = document.getElementById('toast');
      t.style.borderLeftColor = borderColor;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3600);
    }

    function showModal(html) {
      document.getElementById('modalBox').innerHTML = html;
      const mb = document.getElementById('modalBackdrop');
      mb.classList.remove('hidden');
      mb.classList.add('flex');
    }

    function closeModal() {
      const mb = document.getElementById('modalBackdrop');
      mb.classList.add('hidden');
      mb.classList.remove('flex');
    }

    function triggerDemotion(reason) {
      SFX.error();
      STATE.demotions++;
      const badge = document.getElementById('demotionBadge');
      badge.textContent = `DEMOTIONS: ${STATE.demotions}`;
      badge.className = 'px-2.5 py-1.5 rounded-lg bg-rose-950/80 border border-rose-500 text-rose-300 font-bold';

      showModal(`
        <div class="text-rose-400 font-mono-code text-xs tracking-widest uppercase mb-1">⚠ INTRUSION COUNTERMEASURE TRIGGERED</div>
        <h2 class="font-orbitron text-xl font-black text-white mb-3">CLEARANCE DEMOTED TO LEVEL 01</h2>
        <p class="text-sm text-slate-300 leading-relaxed mb-3">${reason}</p>
        <p class="text-xs font-mono-code text-amber-300 mb-5">Security Protocol: Incorrect verification on high-stakes levels resets progress back to Level 01.</p>
        <button onclick="closeModal(); goToLevel(1);" class="w-full py-3 rounded-xl bg-rose-500 hover:bg-rose-400 text-white font-orbitron font-bold text-xs tracking-widest uppercase cursor-pointer">
          REBOOT AT LEVEL 01
        </button>
      `);
    }

    function showLobby() {
      SFX.click();
      STATE.view = 'LOBBY';
      STATE.timerRunning = false;
      document.getElementById('stepperNav').classList.add('hidden');
      document.getElementById('urlPrefix').textContent = 'https://nexus-intel.sec/lobby';
      document.getElementById('addressInput').value = '';
      document.getElementById('addressInput').placeholder = '';
      renderLobby();
    }

    function startMission(targetLevel = 0) {
      if (targetLevel === 0) {
        STATE.seconds = 0;
        STATE.demotions = 0;
        STATE.highestUnlocked = 0;
        document.getElementById('timerBadge').textContent = '00:00';
        document.getElementById('demotionBadge').textContent = 'DEMOTIONS: 0';
        document.getElementById('demotionBadge').className = 'px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-300 font-bold';
      }
      SFX.init();
      SFX.click();
      STATE.view = 'GAME';
      STATE.timerRunning = true;
      document.getElementById('stepperNav').classList.remove('hidden');
      goToLevel(targetLevel);
    }

    function goToLevel(lvl) {
      STATE.view = 'GAME';
      STATE.level = lvl;
      if (lvl > STATE.highestUnlocked && lvl <= 5) {
        STATE.highestUnlocked = lvl;
      }

      // Reset per-level transient flags
      STATE.l1Phase1 = false;
      STATE.l1Phase2 = false;
      STATE.l3Unlocked = false;
      STATE.l4LoopBroken = false;
      STATE.l5CipherDone = false;

      const addrInput = document.getElementById('addressInput');
      addrInput.value = '';

      if (lvl <= 5) {
        document.getElementById('urlPrefix').textContent = `https://nexus-intel.sec/level/${lvl}/`;
        addrInput.placeholder = lvl === 0 ? '' : 'type_passkey_and_press_enter';
      } else {
        document.getElementById('urlPrefix').textContent = `https://nexus-intel.sec/victory`;
        addrInput.placeholder = 'clearance_granted';
      }

      renderStepper();
      renderLevel();
    }

    function renderStepper() {
      const el = document.getElementById('stepper');
      el.innerHTML = LEVELS_META.map((item) => {
        const isCurrent = item.id === STATE.level;
        const isDone = item.id < STATE.level;
        const canJump = item.id <= STATE.highestUnlocked;
        let cls = 'px-2.5 py-1 rounded-md font-mono-code text-[11px] border transition ';
        if (isCurrent) cls += 'bg-cyan-400/15 border-cyan-400 text-cyan-300 font-bold shadow-[0_0_10px_rgba(0,240,255,0.25)]';
        else if (isDone) cls += 'bg-emerald-500/10 border-emerald-500/50 text-emerald-300 hover:bg-emerald-500/20 cursor-pointer';
        else if (canJump) cls += 'bg-slate-900 border-slate-700 text-slate-300 hover:border-cyan-400 cursor-pointer';
        else cls += 'bg-slate-950 border-slate-800/80 text-slate-600 cursor-not-allowed';

        return `<button ${canJump ? `onclick="SFX.click(); goToLevel(${item.id})"` : 'disabled'} class="${cls}">${item.short}</button>`;
      }).join('');
    }

    // Simulated Browser Address Bar Router
    document.getElementById('addressInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAddressBar();
    });

    function submitAddressBar() {
      const raw = document.getElementById('addressInput').value.trim().toLowerCase();
      if (raw === 'lobby' || raw === '/lobby') {
        showLobby();
        return;
      }
      if (STATE.view === 'LOBBY') {
        startMission(0);
        return;
      }

      const cleanKey = raw.split('/').pop();
      const PASSKEYS = {
        1: 'nova_prime',
        2: '9_jolt_shade_0',
        3: '256',
        4: 'ram_rom',
        5: '63'
      };

      if (STATE.level === 0) {
        showToast("Level 00 requires the hidden boot key.", "#ffb800");
        return;
      }
      if (cleanKey === PASSKEYS[STATE.level]) {
        SFX.success();
        showToast(`200 OK // ROUTE UNLOCKED: /level/${STATE.level}/${cleanKey}`, "#00ff88");
        goToLevel(STATE.level + 1);
      } else if (STATE.level === 3) {
        triggerDemotion(`Incorrect route key for Level 03! The dossier answer is 256.`);
      } else {
        SFX.error();
        showToast(`403 FORBIDDEN // INVALID KEY '${cleanKey || "EMPTY"}'`, "#ff3355");
      }
    }

    // =========================================================================
    // 4. LOBBY / LANDING PORTAL VIEW
    // =========================================================================
    function renderEntry() {
      STATE.view = 'ENTRY';
      STATE.timerRunning = false;
      document.getElementById('stepperNav').classList.add('hidden');
      document.getElementById('urlPrefix').textContent = 'https://nexus-intel.sec/entry';
      document.getElementById('addressInput').value = '';
      document.getElementById('addressInput').placeholder = '';
      document.getElementById('appRoot').innerHTML = `
        <section class="cyber-card slide-up-entry rounded-2xl p-8 sm:p-12 text-center border-t-2 border-cyan-400">
          <div class="font-mono-code text-xs text-cyan-300 tracking-[0.3em] uppercase mb-4">Secure access // entry sequence</div>
          <h1 class="font-orbitron text-4xl sm:text-6xl font-black neon-cyan mb-5">CYBER BREACH</h1>
          <p class="text-slate-300 text-sm sm:text-base max-w-xl mx-auto leading-relaxed mb-7">
            Welcome to the cyber intelligence escape room. Enter the mission portal when ready.
          </p>
          <button onclick="showLobby()" class="px-10 py-5 rounded-2xl bg-gradient-to-r from-cyan-400 via-emerald-400 to-cyan-300 text-slate-950 font-orbitron font-black text-lg sm:text-xl tracking-widest uppercase shadow-[0_0_35px_rgba(0,240,255,0.45)] hover:scale-105 hover:brightness-110 transition cursor-pointer">
            ▶ PLAY THE PUZZLE GAME
          </button>
        </section>
        <div class="fixed bottom-5 right-5 z-30 rounded-lg border border-cyan-300/70 bg-slate-950/90 px-4 py-2 font-orbitron text-base sm:text-lg font-bold tracking-wider text-cyan-100 shadow-[0_0_18px_rgba(0,240,255,0.3)]">BUILT BY DEAD PIXELS</div>
      `;
    }

    function renderLobby() {
      const root = document.getElementById('appRoot');
      root.innerHTML = `
        <div class="space-y-8">
          <!-- Hero Mission Portal -->

                <button onclick="verifyL5Cipher()" ${STATE.l5CipherDone ? 'disabled' : ''} class="px-4 py-2 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-orbitron font-bold text-xs cursor-pointer">VERIFY</button>
              </div>
              ${STATE.l5CipherDone ? `
                <div class="mt-3 p-3 rounded-lg bg-slate-950 border border-emerald-500/40 font-mono-code text-xs text-emerald-300">
                  DECODED: <b>HOUSE</b> :: A=0 VALUES: 7 + 14 + 20 + 18 + 4 = <b>63</b>
                </div>
              ` : ''}
            </div>

            ${STATE.l5CipherDone ? `
              <div class="mt-5 p-4 rounded-xl bg-emerald-500/10 border border-emerald-400 font-mono-code text-xs sm:text-sm text-emerald-300">
                ✔ CIPHERTEXT DECODED! Navigate to <span class="font-bold underline">/level/5/63</span> in the top address bar.
              </div>
            ` : ''}
          </div>
        `;
      }

      // VICTORY SUMMARY SCREEN
      else if (STATE.level === 6) {
        STATE.timerRunning = false;
        const m = String(Math.floor(STATE.seconds / 60)).padStart(2, '0');
        const s = String(STATE.seconds % 60).padStart(2, '0');

        root.innerHTML = `
          <div class="cyber-card rounded-2xl p-8 sm:p-10 border-2 border-emerald-400 text-center">
            <div class="inline-block px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400 text-emerald-300 font-mono-code text-xs tracking-widest uppercase mb-3">
              /VICTORY // SUPREME ARCHITECT CLEARANCE GRANTED
            </div>
            <h1 class="font-orbitron text-3xl sm:text-5xl font-black neon-green mb-4">
              NEXUS MAINFRAME LIBERATED
            </h1>
            <p class="text-slate-300 text-sm sm:text-base max-w-xl mx-auto leading-relaxed mb-8">
              Outstanding work, Analyst. You cleared all six security layers, decoded the memory buffer, inspected the DOM vault, broke the inverted screen loop, and solved the final intelligence intercept.
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-xl mx-auto mb-8 font-mono-code">
              <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
                <div class="text-xs text-slate-400 mb-1">TOTAL MISSION TIME</div>
                <div class="text-2xl font-bold text-cyan-300">${m}:${s}</div>
              </div>
              <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
                <div class="text-xs text-slate-400 mb-1">DEMOTION PENALTIES</div>
                <div class="text-2xl font-bold ${STATE.demotions === 0 ? 'text-emerald-400' : 'text-amber-300'}">${STATE.demotions}</div>
              </div>
              <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4">
                <div class="text-xs text-slate-400 mb-1">LAYERS CLEARED</div>
                <div class="text-2xl font-bold text-emerald-400">6 / 6</div>
              </div>
            </div>

            <div class="flex flex-wrap justify-center gap-3">
              <button onclick="resetFullGame()" class="px-7 py-3.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-orbitron font-black text-xs tracking-widest uppercase cursor-pointer">
                PLAY NEW MISSION
              </button>
              <button onclick="showLobby()" class="px-7 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 font-orbitron font-bold text-xs tracking-widest uppercase cursor-pointer">
                RETURN TO LOBBY
              </button>
            </div>
          </div>
        `;
      }
    }

    // =========================================================================
    // 6. PUZZLE INTERACTION HANDLERS
    // =========================================================================
    function authenticateL0() {
      const key = document.getElementById('l0BootKeyInput').value.trim().toUpperCase();
      if (key === 'WELCOME_TO_PUZZLE') {
        SFX.success();
        showModal(`
          <div class="font-mono-code text-xs text-emerald-400 uppercase tracking-widest mb-1">✔ TRANSMISSION AUTHENTICATED</div>
          <h2 class="font-orbitron text-xl font-black text-white mb-3">BEGIN MISSION</h2>
          <p class="text-sm text-slate-300 leading-relaxed mb-5">Boot key accepted. Begin the mission at Level 01.</p>
          <button onclick="closeModal(); goToLevel(1);" class="w-full py-3 rounded-xl bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-orbitron font-black text-xs tracking-widest uppercase cursor-pointer">
            BEGIN MISSION (LEVEL 01) →
          </button>
        `);
      } else {
        SFX.error();
        showToast("BOOT KEY NOT FOUND // Inspect the page for the hidden location.", "#ff3355");
      }
    }

    function checkL1Phase1() {
      const val = Number(document.getElementById('l1CodeInput').value);
      if (val === 110) {
        SFX.success();
        STATE.l1Phase1 = true;
        renderLevel();
      } else {
        SFX.error();
        showToast("Incorrect output! Calculate (13 * 4) + (9 * 6) + 4.", "#ff3355");
      }
    }

    function checkL1Phase2() {
      const val = Number(document.getElementById('l1BinInput').value);
      if (val === 6) {
        SFX.success();
        STATE.l1Phase2 = true;
        renderLevel();
        showToast("Binary Gate Overridden! Type 'nova_prime' in the top address bar.", "#00ff88");
      } else {
        SFX.error();
        showToast("Binary 110 equals (1 * 4) + (1 * 2) + 0.", "#ff3355");
      }
    }

    function toggleL3Source() {
      SFX.click();
      const box = document.getElementById('l3SourceBox');
      box.classList.toggle('hidden');
    }

    function unlockL3Dossier() {
      const code = document.getElementById('l3PassInput').value.trim().toUpperCase();
      if (code === '18_MAY_2096') {
        SFX.success();
        STATE.l3Unlocked = true;
        renderLevel();
        showToast("Dossier #185 decrypted!", "#00ff88");
      } else {
        triggerDemotion("Incorrect DOM passcode! Inspect the dossier comment and enter 18_MAY_2096.");
      }
    }

    function openL4Context(e) {
      e.preventDefault();
      SFX.click();
      const menu = document.getElementById('customContext');
      menu.style.left = Math.min(e.clientX, window.innerWidth - 240) + 'px';
      menu.style.top = Math.min(e.clientY, window.innerHeight - 130) + 'px';
      menu.style.display = 'block';
    }

    document.addEventListener('click', () => {
      document.getElementById('customContext').style.display = 'none';
    });

    function contextInspect() {
      SFX.click();
      showToast("DOM Node: <div class='trap-bar'> — Try 'Break the System Loop'!", "#ffb800");
    }

    function contextReload() {
      SFX.click();
      showToast("Frame reload blocked by temporal loop.", "#ffb800");
    }

    function breakSystemLoop() {
      SFX.success();
      STATE.l4LoopBroken = true;
      renderLevel();
      showToast("System loop broken! Screen restored upright.", "#00ff88");
    }

    function verifyL5Cipher() {
      const val = document.getElementById('l5CipherInput').value.trim();
      if (val === '63') {
        SFX.success();
        STATE.l5CipherDone = true;
        renderLevel();
      } else {
        triggerDemotion("Incorrect letter-value sum! Decode DKQOA by shifting each letter forward four places, then add the A=0 values.");
      }
    }

    function resetFullGame() {
      startMission(0);
    }

    // Boot Website into Landing Lobby
    renderEntry();
  </script>
</body>
</html>
